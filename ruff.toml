# Ruff configuration
# Docs: https://docs.astral.sh/ruff/configuration/

# Target Python version
target-version = "py39"

# Files/directories to include
include = ["*.py", "examples/**/*.py"]

[lint]
# Rule sets to enable:
#   E/W  - pycodestyle (style + warnings)
#   F    - pyflakes (unused imports, undefined names)
#   I    - isort (import ordering)
#   UP   - pyupgrade (modern Python idioms)
select = ["E", "W", "F", "I", "UP"]

[format]
# Use double quotes (consistent with the existing code style)
quote-style = "double"
indent-style = "space"
line-ending = "auto"
